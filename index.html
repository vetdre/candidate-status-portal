<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Candidate Status Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <h1>Check Your Application Status</h1>

  <p>
    This is just a test page. To simulate the real flow, open this page with a
    <code>?token=...</code> in the URL, then enter the last 4 digits of your phone.
  </p>

  <div style="margin: 1rem 0;">
    <label for="last4">Last 4 digits of your phone:</label>
    <input id="last4" type="text" maxlength="4" />
    <button onclick="checkStatus()">Check status</button>
  </div>

  <div id="status" style="margin: 0.5rem 0; font-weight: bold;"></div>
  <div id="result" style="margin-top: 1rem;"></div>

  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 🔴 IMPORTANT:
    // Replace these two values with the ones you already have working.
    const SUPABASE_URL = 'https://nnauvyublclfeqizpawr.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_PUBLISHABLE_KEY_HERE';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Helper to format timestamps as 12-hour Eastern time
    function formatDateTime(isoString) {
      if (!isoString) return 'N/A';

      const dt = new Date(isoString);
      return dt.toLocaleString('en-US', {
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true,                // 12-hour clock with AM/PM
        timeZone: 'America/New_York' // force Eastern time display
      });
    }

    async function checkStatus() {
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      statusEl.textContent = '';
      resultEl.innerHTML = '';

      // Get magic token from URL (?token=...)
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const last4 = document.getElementById('last4').value.trim();

      if (!token) {
        statusEl.textContent = 'No token found in URL (?token=...).';
        return;
      }

      if (!last4) {
        statusEl.textContent = 'Enter the last 4 digits of your phone.';
        return;
      }

      statusEl.textContent = 'Checking status...';

      try {
        const { data, error } = await client
          .from('Candidates')          // Supabase table name
          .select('*')
          .eq('magic_token', token)
          .eq('last_four', last4);

        console.log('Supabase response:', { data, error });

        if (error) {
          statusEl.textContent = 'Error talking to Supabase. See console.';
          console.error(error);
          return;
        }

        if (!data || data.length === 0) {
          statusEl.textContent = 'No matching candidate found.';
          return;
        }

        const c = data[0];
        statusEl.textContent = 'Match found.';

        const stageUpdated  = formatDateTime(c.stage_updated);
        const nextInterview = c.next_interview
          ? formatDateTime(c.next_interview)
          : 'Not scheduled';

        const recruiterName = c.recruiter || 'N/A';
        const hiringManager = c.hiring_manager || 'N/A';

        resultEl.innerHTML = `
          <h2>Hello ${c.name || 'there'}</h2>
          <p><strong>Position:</strong> ${c.position || 'N/A'}</p>
          <p><strong>Current stage:</strong> ${c.current_stage || 'N/A'}</p>
          <p><strong>Last updated:</strong> ${stageUpdated}</p>
          <p><strong>Next interview:</strong> ${nextInterview}</p>
          <p><strong>Recruiter:</strong> ${recruiterName}</p>
          <p><strong>Hiring manager:</strong> ${hiringManager}</p>
        `;
      } catch (e) {
        statusEl.textContent = 'Unexpected error. See console.';
        console.error(e);
      }
    }

    // make checkStatus available to the button's onclick
    window.checkStatus = checkStatus;
  </script>
</body>
</html>
